name: fynans
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2 
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Drift + SQLCipher. sqlite3 3.x selects the native build through the
  # hooks block at the end of this file, so no *_flutter_libs package and no
  # runtime DynamicLibrary override are involved.
  drift: ^2.34.3
  sqlite3: ^3.5.0
  flutter_secure_storage: ^9.2.2 # Keystore-backed home for the Hive AES key
  path_provider: ^2.1.3
  fl_chart: ^1.0.0
  wheel_picker: ^0.2.2
  flutter_bloc: ^9.1.1
  flutter_sms_inbox: ^1.0.4 # read the SMS inbox for bank-transaction import
  permission_handler: ^12.0.1
  shared_preferences: ^2.2.3
  equatable: ^2.0.7
  bloc: ^9.0.0
  meta: ^1.16.0

dev_dependencies:
  # Used by test/ui/font_assets_test.dart to read the declared font assets.
  yaml: ^3.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.34.5
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Iosevka (SIL OFL 1.1, see assets/fonts/Iosevka-LICENSE.md). Subset to the
  # codepoints the app can render; the upstream faces carry ~47k glyphs each.
  fonts:
    - family: Iosevka
      fonts:
        - asset: assets/fonts/Iosevka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Iosevka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Iosevka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Iosevka-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Links SQLCipher instead of stock SQLite. Without this the app would run on
# plain SQLite, which silently ignores PRAGMA key and writes plaintext.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
